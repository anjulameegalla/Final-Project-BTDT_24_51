services:
  mongodb:
    image: mongo:7.0
    container_name: cloudguard_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: cloudguard_db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudguard_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      DATABASE_NAME: cloudguard_db
      DEMO_MODE: "false"
    volumes:
      - ./backend/reports:/app/reports
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudguard_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
